<!-- Supabase > Authentication > Email Templates > "Confirm signup"
     Assunto sugerido: Seu código de verificação — Estilos Gestor -->
<div style="font-family:Inter,Arial,sans-serif;background:#F3F6FA;padding:32px">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden">
    <div style="background:#0B1D3A;padding:24px 28px;color:#ffffff;font-size:20px;font-weight:700">
      Estilos <span style="color:#3B82F6">Gestor</span>
    </div>
    <div style="padding:28px;color:#0B1D3A">
      <p style="margin:0 0 12px;font-size:16px">Olá! Use o código abaixo para confirmar seu e-mail:</p>
      <p style="margin:20px 0;font-size:34px;letter-spacing:8px;font-weight:700;color:#2563EB">{{ .Token }}</p>
      <p style="margin:0;color:#5b6b82;font-size:14px">Se você não criou uma conta no Estilos Gestor, ignore este e-mail.</p>
    </div>
  </div>
</div>
